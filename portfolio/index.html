<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Marketing & Product Innovation</title>
  <meta name="description" content="Portfolio ด้านการตลาดและการพัฒนาผลิตภัณฑ์/นวัตกรรม | Marketing & Product Innovation portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="links" id="links"></nav>
    <button class="lang" id="lang" aria-label="Switch language">EN</button>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="lead" id="hero-lead"></p>
      <div class="cta">
        <a class="btn primary" href="#projects" id="hero-cta1"></a>
        <a class="btn" href="#contact" id="hero-cta2"></a>
      </div>
      <ul class="stats" id="stats"></ul>
    </section>

    <section id="about"><h2 id="about-h"></h2><div class="about" id="about-body"></div></section>
    <section id="skills"><h2 id="skills-h"></h2><div class="grid3" id="skills-body"></div></section>
    <section id="projects"><h2 id="projects-h"></h2><div class="grid2" id="projects-body"></div></section>
    <section id="journey"><h2 id="journey-h"></h2><ol class="timeline" id="journey-body"></ol></section>
    <section id="contact"><h2 id="contact-h"></h2><p class="lead" id="contact-lead"></p><div class="contacts" id="contact-body"></div></section>
  </main>

  <footer id="footer"></footer>
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
