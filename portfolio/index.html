<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattarakrit Portfolio</title>
  <meta name="description" content="Portfolio ของภัทรกริช สิทธิวงค์ษา นักศึกษา Digital Marketing ม.ศรีปทุม | Digital Marketing student portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700;800&family=Noto+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="links" id="links"></nav>
    <button class="lang" id="lang" aria-label="Switch language">EN</button>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="lead" id="hero-lead"></p>
        <div class="cta">
          <a class="btn pink" href="#projects" id="hero-cta1"></a>
          <a class="btn" href="#contact" id="hero-cta2"></a>
        </div>
      </div>
      <figure class="polaroid">
        <img id="hero-img" alt="">
        <span class="sticker" id="hero-sticker"></span>
      </figure>
    </section>

    <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

    <ul class="stats" id="stats"></ul>

    <section id="about"><h2 id="about-h"></h2>
      <div class="about">
        <div class="obsess">
          <p class="kicker" id="about-kicker"></p>
          <div class="chips" id="about-chips"></div>
          <p class="punch" id="about-punch"></p>
        </div>
        <div class="about-body" id="about-body"></div>
      </div>
    </section>
    <section id="skills"><h2 id="skills-h"></h2><div class="grid3" id="skills-body"></div></section>
    <section id="projects"><h2 id="projects-h"></h2><div class="grid2" id="projects-body"></div></section>
    <section id="certs"><h2 id="certs-h"></h2><div class="certs" id="certs-body"></div></section>
    <section id="gallery"><h2 id="gallery-h"></h2><div class="gallery" id="gallery-body"></div></section>
    <section id="journey"><h2 id="journey-h"></h2><ol class="timeline" id="journey-body"></ol></section>
    <section id="contact" class="contact"><h2 id="contact-h"></h2><p class="lead" id="contact-lead"></p><div class="contacts" id="contact-body"></div></section>
  </main>

  <footer id="footer"></footer>
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
